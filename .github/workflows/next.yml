name: next

on:
  push:
    paths:
      - "next/**"
      - ".github/workflows/next.yml"
  pull_request:
    paths:
      - "next/**"
      - ".github/workflows/next.yml"

defaults:
  run:
    working-directory: next

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: next/backend/go.mod
          cache-dependency-path: next/backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14
          working-directory: next/backend
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14
          working-directory: next/backend
          args: --build-tags cpp
      - run: cd backend && go vet ./... && go vet -tags cpp ./...
      - run: make test-go
      - run: make test-cpp

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next/web/package-lock.json
      - run: cd web && npm ci
      - run: make lint-web
      - run: make test-web

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: next/backend/go.mod
          cache-dependency-path: next/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next/web/package-lock.json
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: make test-e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: next/web/playwright-report

  # Static binaries with the C++ planner, built natively per architecture
  # (arm64 = Raspberry Pi 4/5 with a 64-bit OS). Download them from the run.
  release-build:
    needs: [backend, web]
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: next/backend/go.mod
          cache-dependency-path: next/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next/web/package-lock.json
      - run: cd web && npm ci
      - run: make test-cpp
      - run: make build-static
      - name: Check the binary is static and starts
        run: |
          bin=bin/cassandra-linux-$(go env GOARCH)
          file $bin
          file $bin | grep -q "statically linked"
          $bin --version
          $bin --check-planner
          $bin --port 4180 --data-dir "$RUNNER_TEMP/data" &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:4180/api/health && break; sleep 0.2; done
          curl -sf http://127.0.0.1:4180/api/health
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: cassandra-linux-${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
          path: next/bin/cassandra-linux-*
